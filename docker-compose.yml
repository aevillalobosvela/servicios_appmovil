version: '3.8'

services:
  # ── Servidor Backend (AdonisJS) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uto-backend
    volumes:
      - banner-uploads:/app/public/uploads
    restart: always
    ports:
      - "${BACKEND_PORT:-3333}:3333"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: UTC
      PORT: 3333
      HOST: 0.0.0.0
      NODE_ENV: production
      LOG_LEVEL: info
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL:-http://localhost:3333}
      SESSION_DRIVER: ${SESSION_DRIVER:-cookie}
      DB_HOSTNAME: ${DB_HOSTNAME}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      AGETIC_CLIENT_ID: ${AGETIC_CLIENT_ID}
      AGETIC_REDIRECT_URI: ${AGETIC_REDIRECT_URI}
    healthcheck:
      test: [ "CMD-SHELL", "node -e \"const http = require('http'); const req = http.request({host: 'localhost', port: 3333, path: '/api/v1', timeout: 2000}, (res) => { process.exit(res.statusCode === 404 || res.statusCode === 200 ? 0 : 1); }); req.on('error', () => process.exit(1)); req.end();\"" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Panel Administrativo Web (React + Nginx) ──
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3333/api/v1}
    container_name: uto-admin
    restart: always
    ports:
      - "${ADMIN_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  banner-uploads:
    name: servicios_app_back_banner-uploads
